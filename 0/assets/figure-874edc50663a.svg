<title>Variance of negative-pair similarities</title><desc>Negative-pair similarity variance decreases with batch size. SimCLR values at batch sizes 32, 64, 128, 256, 512 are 0.1649, 0.1505, 0.1444, 0.1404, 0.1396. With the variance penalty the values are 0.1008, 0.0952, 0.0929, 0.0921, 0.0917. The vertical axis starts at zero. Exact values from Table 1 of the ICML 2025 paper.</desc>
